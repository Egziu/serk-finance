# Staging scaffold. Replace image and Secret references; complete release gates first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serk-finance
spec:
  replicas: 2
  selector: {matchLabels: {app: serk-finance}}
  template:
    metadata: {labels: {app: serk-finance}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: REPLACE_WITH_SCANNED_IMAGE_DIGEST
          ports: [{containerPort: 8080}]
          env:
            - {name: SERK_ENV, value: production}
            - {name: SERK_ORIGIN, valueFrom: {configMapKeyRef: {name: serk-finance-config, key: origin}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: serk-finance-db, key: api-url}}}
            - {name: AUTH_DATABASE_URL, valueFrom: {secretKeyRef: {name: serk-finance-db, key: auth-url}}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: '2', memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: serk-finance}
spec:
  selector: {app: serk-finance}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: serk-finance}
spec: {minAvailable: 1, selector: {matchLabels: {app: serk-finance}}}
